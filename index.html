<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eLearning Company</title>
    <link rel="stylesheet" href="/dist/styles.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__grid">
        <div class="hero__card hero__card--logo">
          <img src="./assets/images/main-section/logo-on-white.svg" alt="eLearning Company Logo" class="hero__card-logo" />
          <p class="hero__card-tagline">Taking Learning to the Next Level</p>
        </div>
        <div class="hero__card hero__card--services"><h2 class="hero__card-title">Services</h2></div>
        <div class="hero__card hero__card--design"><h2 class="hero__card-title">Instructional Design</h2></div>
        <div class="hero__card hero__card--development"><h2 class="hero__card-title">eLearning Development</h2></div>
        <div class="hero__card hero__card--quote">
          <h2 class="hero__card-title">
            eLearning<br />
            Price Quote
          </h2>
        </div>
        <div class="hero__card hero__card--packages"><h2 class="hero__card-title">eLearning Packages</h2></div>
        <div class="hero__card hero__card--extra"></div>
        <div class="hero__card hero__card--contact">
          <img class="hero__contact-icon" src="./assets/images/main-section/contact-us-icon.svg" alt="Icon contact us" />
          <h2 class="hero__card-title">Contact us</h2>
        </div>
      </div>

    </header>
    <div class="stripe"></div>
    <!-- Bootstrap Navbar -->
      <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
          <a class="navbar-brand" href="#">
            <img src="./assets/images/main-section/logo-on-dark.svg" alt="eLearning Company Logo" />
          </a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Instructional Design</a></li>
              <li class="nav-item"><a class="nav-link" href="#">eLearning Development</a></li>
              <li class="nav-item"><a class="nav-link" href="#">eLearning Price Quote</a></li>
              <li class="nav-item"><a class="nav-link" href="#">eLearning Packages</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
